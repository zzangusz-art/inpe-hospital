<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>INPE Hospital Reel — renderer</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* 인프 병원·산후조리원 청소 15초 쇼릴 렌더러 (차분한 버전)
   - render(t) 는 시간 t(초)에 대한 프레임을 결정적으로 그린다 (같은 t → 같은 그림)
   - render.js 가 0~449 프레임을 돌며 캔버스를 캡처 → ffmpeg 로 mp4 인코딩
   - ?w=1920&h=1080 (데스크톱) / ?w=720&h=1520 (모바일)
   - 장면: 병실 → 다인 병실 → 대기실 소파 → 야간 복도 → 엔드 카드. 느린 줌 + 크로스페이드만 사용 (컷·번쩍임·글리치 없음)
   - 공간 사진은 Unsplash 참고 이미지라 화면 오른쪽 아래에 '참고 이미지'를 표시 */
const P = new URLSearchParams(location.search);
const W = +P.get('w') || 1920, H = +P.get('h') || 1080, DUR = 15, FPS = 30;
const c = document.getElementById('c'); c.width = W; c.height = H;
const x = c.getContext('2d');
const PORT = H > W;
const U = Math.min(W, H) / 1080;
/* 세이프 영역: 16:10 노트북 · 19.5:9 폰에서 cover 크롭돼도 글자가 잘리지 않도록 */
const SX = PORT ? W * 0.08 : W * 0.075, SY = PORT ? H * 0.04 : H * 0.06;
const ORANGE = '#FF5A00', INK = '#0B0B0B';

/* ---------- utils ---------- */
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const pr = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const eIO = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
const eOut = p => 1 - Math.pow(1 - p, 3);

const IMG = {};
const NAMES = ['hosp-room-warm', 'hosp-ward-3beds', 'clinic-waiting-sofa', 'hosp-corridor-night'];

function cover(img, dx, dy, dw, dh, zoom = 1, fx = .5, fy = .5) {
  const ir = img.width / img.height, r = dw / dh;
  let sw, sh;
  if (ir > r) { sh = img.height; sw = sh * r; } else { sw = img.width; sh = sw / r; }
  sw /= zoom; sh /= zoom;
  x.drawImage(img, (img.width - sw) * fx, (img.height - sh) * fy, sw, sh, dx, dy, dw, dh);
}
function font(w, s) { x.font = `${w} ${s}px NK`; }
function txt(s, px, py, o = {}) {
  if (!s) return;
  x.save();
  x.letterSpacing = (o.ls || 0) + 'px';
  let size = o.size || 40; font(o.w || 700, size);
  if (o.max) { const m = x.measureText(s).width; if (m > o.max) { size = size * o.max / m; font(o.w || 700, size); } }
  x.globalAlpha *= (o.alpha == null ? 1 : o.alpha);
  x.fillStyle = o.color || '#fff'; x.textAlign = o.align || 'left'; x.textBaseline = o.base || 'alphabetic';
  x.fillText(s, px, py);
  x.restore();
}

/* ---------- 장면 정의 ----------
   [이미지, 시작, 끝, 초점x, 초점y, 줌 시작, 줌 끝, 문구 {eb, l1, l2, sub}] */
const SC = [
  ['hosp-room-warm', 0.0, 3.8, .55, .5, 1.12, 1.03, { eb: '병원 · 산후조리원 청소', l1: '환자가 눕는 자리는', l2: '닦는 걸로는 부족합니다', sub: '' }],
  ['hosp-ward-3beds', 3.0, 7.0, .5, .55, 1.03, 1.11, { eb: '01  병상 매트리스', l1: '커버 아래 본체까지', l2: '', sub: '건식 흡입부터 순서대로, 비는 병상부터 차례로' }],
  ['clinic-waiting-sofa', 6.2, 10.2, .45, .55, 1.12, 1.03, { eb: '02  대기실 소파', l1: '하루 수십 명이 앉는 소파', l2: '', sub: '표면을 닦는 대신 섬유 속 오염을 뽑아냅니다' }],
  ['hosp-corridor-night', 9.4, 13.2, .5, .62, 1.04, 1.12, { eb: '03  진료가 끝난 뒤', l1: '야간 · 주말에', l2: '구역을 나눠 들어갑니다', sub: '작업 전후 기록은 매달 리포트로 드립니다' }],
];
const XF = 0.8;          // 크로스페이드 길이
const END = 12.4;        // 엔드 카드 시작

function photoAlpha(i, t) {
  const [, a, b] = SC[i];
  const fin = i === 0 ? eIO(pr(t, 0, 1.0)) : eIO(pr(t, a, a + XF));
  const fout = i === SC.length - 1 ? 1 - eIO(pr(t, END, END + 0.9)) : 1;
  return t < a || t > b ? 0 : fin * fout;
}

function drawPhoto(i, t, alpha) {
  if (alpha <= 0) return;
  const [n, a, b, fx, fy, z0, z1] = SC[i];
  const p = pr(t, a, b);
  x.save(); x.globalAlpha = alpha;
  cover(IMG[n], 0, 0, W, H, lerp(z0, z1, p), fx, fy);
  // 차분한 톤: 살짝 차갑고 어둡게
  x.fillStyle = 'rgba(12,20,28,.22)'; x.fillRect(0, 0, W, H);
  // 글자 쪽 그라데이션
  let g;
  if (PORT) { g = x.createLinearGradient(0, H * .35, 0, H); g.addColorStop(0, 'rgba(8,12,16,0)'); g.addColorStop(1, 'rgba(8,12,16,.86)'); }
  else { g = x.createLinearGradient(0, 0, W * .72, 0); g.addColorStop(0, 'rgba(8,12,16,.78)'); g.addColorStop(1, 'rgba(8,12,16,0)'); }
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.restore();
}

function drawCopy(i, t) {
  const [, a, , , , , , o] = SC[i];
  const ts = (i === 0 ? 0.5 : a + XF * .6);
  const te = (i === SC.length - 1 ? END : SC[i + 1][1]);
  const fadeOut = 1 - eIO(pr(t, te - 0.1, te + 0.5));
  if (fadeOut <= 0 || t < ts) return;
  const item = (k, d = 0.9) => { const p = eOut(pr(t, ts + k * 0.22, ts + k * 0.22 + d)); return { a: p * fadeOut, dy: (1 - p) * 18 * U }; };
  const big = PORT ? 70 * U : 78 * U, lh = big * 1.24;
  const left = SX;
  const lines = [o.l1, o.l2].filter(Boolean);
  const base = PORT ? H - SY - 200 * U : H * .5 + (lines.length === 2 ? lh * .5 : lh * .1);
  const maxW = PORT ? W - SX * 2 : W * .52;
  const e = item(0); txt(o.eb, left, base - lh * lines.length - 26 * U + e.dy, { size: 24 * U, w: 700, color: ORANGE, ls: 3 * U, alpha: e.a });
  lines.forEach((l, k) => { const it = item(k + 1); txt(l, left, base - lh * (lines.length - 1 - k) + it.dy, { size: big, w: 800, ls: -1.5 * U, alpha: it.a, max: maxW }); });
  if (o.sub) { const it = item(lines.length + 1); txt(o.sub, left, base + 64 * U + it.dy, { size: 30 * U, w: 400, color: 'rgba(255,255,255,.82)', alpha: it.a, max: maxW }); }
}

function endCard(t) {
  const p = eIO(pr(t, END, END + 0.9));
  if (p <= 0) return;
  x.save(); x.globalAlpha = p; x.fillStyle = INK; x.fillRect(0, 0, W, H); x.restore();
  const q = k => eOut(pr(t, END + 0.5 + k * 0.18, END + 1.4 + k * 0.18));
  const ls = 150 * U, s = lerp(.96, 1, q(0));
  let lx, ly, tx0, al, wy;
  if (PORT) { lx = W / 2 - ls / 2; ly = H * .36 - ls / 2; tx0 = W / 2; al = 'center'; wy = H * .36 + 190 * U; }
  else { font(900, 140 * U); const ww = x.measureText('인프').width; const gw = ls + 48 * U + ww; lx = W / 2 - gw / 2; ly = H * .40 - ls / 2; tx0 = lx + ls + 48 * U; al = 'left'; wy = H * .40 + 48 * U; }
  x.save(); x.globalAlpha = q(0); x.translate(lx + ls / 2, ly + ls / 2); x.scale(s, s);
  const L = IMG['logo']; x.drawImage(L, -ls / 2, -ls / 2, ls, ls);
  x.restore();
  txt('인프', tx0, wy, { size: 140 * U, w: 900, align: al, ls: -3 * U, alpha: q(1) });
  txt('병원 · 산후조리원 청소', tx0 + (PORT ? 0 : 4 * U), wy + 62 * U, { size: 32 * U, w: 500, color: '#a8a8a8', align: al, ls: 3 * U, alpha: q(2) });
  const tagY = PORT ? wy + 170 * U : H * .68;
  txt('정기청소  ·  병상 매트리스 · 대기실 소파  ·  바닥 청소 · 코팅', W / 2, tagY, { size: 28 * U, w: 500, color: '#d6d6d6', align: 'center', alpha: q(3), max: W * .86 });
  txt('0507-1314-5792   ·   현장 실측 무료', W / 2, tagY + 60 * U, { size: 26 * U, w: 700, color: ORANGE, align: 'center', ls: 2 * U, alpha: q(4) });
}

function hud(t) {
  const a = 1 - pr(t, END, END + 0.6);
  if (a <= 0) return;
  x.save(); x.globalAlpha = a;
  txt('인프 · 병원 · 산후조리원 청소', SX, SY + 10 * U, { size: 17 * U, w: 600, color: 'rgba(255,255,255,.6)', ls: 2 * U });
  txt('참고 이미지', W - SX, H - SY - 18 * U, { size: 15 * U, w: 600, color: 'rgba(255,255,255,.55)', align: 'right', ls: 1 * U });
  const py = H - SY;
  x.fillStyle = 'rgba(255,255,255,.18)'; x.fillRect(SX, py, W - SX * 2, 1.5 * U);
  x.fillStyle = 'rgba(255,255,255,.7)'; x.fillRect(SX, py, (W - SX * 2) * (t / DUR), 1.5 * U);
  x.restore();
}

/* ---------- main ---------- */
window.render = function (t) {
  x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; x.filter = 'none';
  x.fillStyle = '#000'; x.fillRect(0, 0, W, H);
  SC.forEach((_, i) => drawPhoto(i, t, photoAlpha(i, t)));
  SC.forEach((_, i) => drawCopy(i, t));
  endCard(t);
  const vg = x.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .4, W / 2, H / 2, Math.hypot(W, H) * .62);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.28)');
  x.fillStyle = vg; x.fillRect(0, 0, W, H);
  hud(t);
};

(async function boot() {
  const f = new FontFace('NK', 'url(NotoSansKR-VF.ttf)', { weight: '100 900' });
  await f.load(); document.fonts.add(f);
  await Promise.all(NAMES.map(n => new Promise((res, rej) => { const i = new Image(); i.onload = () => { IMG[n] = i; res(); }; i.onerror = () => rej(n); i.src = '../assets/img/stock/' + n + '.jpg'; })));
  await new Promise((res, rej) => { const i = new Image(); i.onload = () => { IMG.logo = i; res(); }; i.onerror = rej; i.src = '../assets/img/logo-512.png'; });
  window.render(+(P.get('t') || 0));
  window.READY = true;
})();
</script>
</body>
</html>
